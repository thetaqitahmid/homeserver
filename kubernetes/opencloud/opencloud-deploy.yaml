apiVersion: v1
kind: Namespace
metadata:
  name: opencloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: init
          image: "${OPENCLOUD_IMAGE}"
          command: ["/bin/sh", "-c"]
          # Prints/sets the initial admin password on first start only.
          # NOTE: --insecure must be explicit; default "ask" blocks on stdin and loops forever in K8s.
          args: ["opencloud init --insecure false || true"]
          env:
            - name: OC_INSECURE
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              value: "${OPENCLOUD_ADMIN_PASSWORD}"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: OC_URL
              value: "https://${OPENCLOUD_HOST}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
      containers:
        - name: opencloud
          image: "${OPENCLOUD_IMAGE}"
          command: ["/bin/sh", "-c"]
          args: ["opencloud server"]
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: OC_URL
              value: "https://${OPENCLOUD_HOST}"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: STORAGE_USERS_DRIVER
              value: "posix"
            - name: STORAGE_USERS_ID_CACHE_STORE
              value: "nats-js-kv"
            - name: STORAGE_USERS_POSIX_WATCH_FS
              value: "true"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              value: "${OPENCLOUD_ADMIN_PASSWORD}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
spec:
  selector:
    app: opencloud
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencloud-ingress
  namespace: opencloud
  annotations:
    cert-manager.io/cluster-issuer: "acme-issuer"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${OPENCLOUD_HOST}"
      secretName: opencloud-tls
  rules:
    - host: "${OPENCLOUD_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencloud
                port:
                  number: 9200
