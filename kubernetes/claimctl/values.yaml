imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

keyGeneration:
  enabled: false
  image:
    repository: bitnamilegacy/kubectl
    tag: "1.33.4"
    pullPolicy: IfNotPresent
  secretName: ""
  keyName: "app-encryption-key"

backend:
  replicaCount: 1
  strategy: {}
  revisionHistoryLimit: 10
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  extraEnv: []
  waitForDb:
    enabled: true
    image:
      repository: postgres
      tag: "18-alpine"
      pullPolicy: IfNotPresent
  pdb:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    behavior: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: ghcr.io/thetaqitahmid/claimctl/backend
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  otel:
    endpoint: ""
  sslMode: "disable"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  startupProbe:
    httpGet:
      path: /v1/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /v1/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /v1/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

frontend:
  replicaCount: 1
  strategy: {}
  revisionHistoryLimit: 10
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  pdb:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    behavior: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: ghcr.io/thetaqitahmid/claimctl/frontend
    pullPolicy: Always
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  startupProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  extraEnv: []

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: "acme-issuer"
  hosts:
    - host: ${CLAIMCTL_HOST}
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
        - path: /api
          pathType: Prefix
          service: backend
          port: 3000
  tls:
    - secretName: claimctl-tls
      hosts:
        - "${CLAIMCTL_HOST}"

db:
  host: db
  port: 5432
  user: ""
  name: ""
  password: ""
  existingSecret: claimctl-credentials
  existingSecretUserKey: db-user
  existingSecretPasswordKey: db-password
  existingSecretNameKey: db-name

appEncryption:
  existingSecret: claimctl-credentials
  secretKey: "app-encryption-key"

networkPolicy:
  # Requires the ingress controller selector below to be configured so traffic
  # can reach the workloads.
  enabled: false
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  externalDbCIDRs: []

postgres:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  affinity: {}
  podLabels: {}
  nodeSelector: {}
  settings:
    existingSecret: claimctl-credentials
    superuserPassword:
      value: ""
      secretKey: admin-password
  userDatabase:
    existingSecret: claimctl-credentials
    name:
      value: ""
      secretKey: db-name
    user:
      value: ""
      secretKey: db-user
    password:
      value: ""
      secretKey: db-password
  storage:
    requestedSize: 1Gi
    accessModes:
      - ReadWriteOnce
    className: "longhorn"
