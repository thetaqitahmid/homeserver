apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 10m
  timeout: 12m
  releaseName: stirling-pdf
  targetNamespace: stirling-pdf
  chart:
    spec:
      chart: stirling-pdf-chart
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
  valuesFrom:
    - kind: ConfigMap
      name: stirling-pdf-values
      valuesKey: values.yaml
