apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-adguard
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./kubernetes/flux/apps/adguard
  prune: false
  deletionPolicy: Orphan
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: homelab
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: ingress-hostnames
        optional: false
---
