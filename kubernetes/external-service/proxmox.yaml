---
apiVersion: v1
kind: Namespace
metadata:
  name: external-services

---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-proxy
  namespace: external-services
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-proxy
  namespace: external-services
  labels:
    kubernetes.io/service-name: proxmox-proxy
    endpointslice.kubernetes.io/managed-by: homelab
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 8006
endpoints:
  - addresses:
      - "${PROXMOX_IP}"
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox-route
  namespace: external-services
  annotations:
    cert-manager.io/cluster-issuer: acme-issuer
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${PROXMOX_HOST}"
      secretName: proxmox-tls
  rules:
    - host: "${PROXMOX_HOST}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxmox-proxy
                port:
                  number: 8006
